name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # CI собирает канал `dev` и подписывает отдельным dev-секретом: релизный
          # секрет в CI не попадает вовсе. Для pull request из форка GitHub секреты
          # не выдаёт, и такая сборка честно остаётся неофициальной.
          ZABOR_CLIENT_SECRET: ${{ github.event_name == 'push' && secrets.ZABOR_CLIENT_DEV_SECRET || '' }}
          ZABOR_CLIENT_CHANNEL: dev
